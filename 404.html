<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found · Nullware Labs</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo/nullware_logo.png">
<link rel="stylesheet" href="/assets/css/style.css">
<script>
try {
  var t = localStorage.getItem('nullware-theme') || (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
  document.documentElement.dataset.theme = t;
  var p = location.pathname.replace(/^\/+|\/+$/g, '');
  var known = ['products', 'projects', 'changelog', 'docs', 'about', 'contact'];
  if (p && known.indexOf(p.split('/')[0]) !== -1) {
    location.replace('/#/' + p);
  }
} catch (e) {}
</script>
</head>
<body>
<header class="site-header">
 <div class="wrap header-inner">
  <a class="brand" href="/">null<mark>ware</mark> labs</a>
 </div>
</header>
<main class="wrap main-content">
 <div class="empty">
  <p class="kicker">Error 404</p>
  <h1 style="font-size:2.2rem;margin:0 auto 12px">Page not found</h1>
  <p>The page you requested does not exist or has moved.</p>
  <div class="row" style="justify-content:center;margin-top:18px">
   <a class="btn primary" href="/">Back to home</a>
   <a class="btn" href="/#/products">Explore products</a>
   <a class="btn" href="/#/docs">Documentation</a>
  </div>
 </div>
</main>
</body>
</html>
